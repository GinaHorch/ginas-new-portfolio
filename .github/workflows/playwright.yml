name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    # Visual regression is deliberately excluded here. Baselines are committed per
    # platform (`-desktop-darwin`, `-mobile-darwin`) and were recorded on macOS, so a
    # Linux runner looks for `-linux` baselines that do not exist and fails every
    # snapshot test. Copying the darwin files across would not help either — font
    # rasterisation differs between the two platforms by far more than the 150-pixel
    # budget in playwright.config.ts allows.
    #
    # Visual regression therefore stays a local gate: run `npm run test:e2e` before
    # pushing. CI covers behaviour — visitor journey and mobile navigation.
    - name: Run Playwright tests
      run: npx playwright test --grep-invert "visual regression"
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
